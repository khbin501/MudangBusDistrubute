<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>무당이 알리미 MVP</title>
    <!-- Tailwind CSS (CDN으로 바로 불러옴) -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans">
    <!-- 모바일 화면 크기에 맞춘 컨테이너 -->
    <div class="max-w-md mx-auto bg-white min-h-screen shadow-lg relative pb-10">
        
        <!-- Header -->
        <header class="bg-blue-600 text-white p-4 text-center text-xl font-bold shadow-md">
            🚌 무당이 알리미
        </header>

        <!-- 정류장 선택 탭 (반도체대학 앞 / 에공 앞) -->
        <div class="flex border-b border-gray-200 bg-white sticky top-0 z-10">
            <button id="tab-bando" onclick="switchTab('반도체대학 앞')" class="flex-1 py-3 text-center font-bold text-blue-600 border-b-2 border-blue-600 transition-colors">
                반도체대학 앞
            </button>
            <button id="tab-aigong" onclick="switchTab('AI공학관 앞')" class="flex-1 py-3 text-center text-gray-400 font-medium hover:text-blue-400 transition-colors">
                AI공학관 앞
            </button>
        </div>

        <!-- Main Content -->
        <div class="p-5 space-y-6">
            
            <!-- 1. GET 데이터 디스플레이 영역 (대시보드) -->
            <section class="bg-blue-50 p-5
여기에서 대기열 레벨이 1~3까지는 초록 4~6까지는 주황 7~10까지는 빨강으로 표기되게 해야하고 rounded-2xl shadow-sm border border-blue-100">
                <h2 class="text-sm text-gray-500 mb-1 font-medium"><span id="current-station">반도체대학 앞</span> 현재 예상 대기열</h2>
                <div class="flex items-baseline gap-2">
                    <!-- 서버에서 가중치 평균을 내서 보내줄 데이터 -->
                    <span class="text-4xl font-extrabold text-blue-700">Lv. 7</span>
                    <span class="text-lg text-gray-500 font-medium">/ 10</span>
                </div>
                <p class="text-xs text-gray-400 mt-2 flex items-center gap-1">
                    🕒 마지막 제보: 방금 전 (14:30)
                </p>
            </section>

            <!-- 도착 예정 알림 (반대편에서 출발 제보가 있을 때 띄워줌) -->
            <section class="bg-yellow-50 border border-yellow-300 p-4 rounded-xl flex items-center gap-3 shadow-sm">
                <span class="text-3xl">🚨</span>
                <div class="text-sm">
                    <p class="font-bold text-yellow-800" id="incoming-msg">AI공학관에서 큰무당이가 출발했어요!</p>
                    <p class="text-yellow-700 mt-0.5 font-medium">약 3~5분 뒤 도착 예정입니다.</p>
                </div>
            </section>

            <hr class="border-gray-100">

            <!-- 2. POST 데이터 입력 영역 (제보하기) -->
            <h3 class="font-bold text-lg text-gray-800">실시간 상황 제보하기</h3>

            <!-- 기다려요 제보 폼 -->
            <div class="bg-white border border-gray-200 p-5 rounded-2xl shadow-sm">
                <h4 class="font-bold mb-3 flex items-center gap-2">🙋‍♂️ 대기열 길이 제보 (기다려요)</h4>
                <label class="block text-sm text-gray-600 mb-4">현재 줄이 얼마나 긴가요?</label>
                
                <!-- 1~10 슬라이더 -->
                <input type="range" min="1" max="10" value="5" id="queue-slider" class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-blue-600 mb-2">
                
                <div class="flex justify-between text-xs text-gray-400 mb-6 font-medium">
                    <span>널널함 (1)</span>
                    <span id="slider-value" class="text-blue-600 font-bold text-sm">보통 (5)</span>
                    <span>매우 긺 (10)</span>
                </div>
                <button onclick="alert('대기열 정보가 서버로 전송되었습니다! (client 시간 포함)')" class="w-full bg-blue-100 text-blue-700 py-3 rounded-xl font-bold hover:bg-blue-200 transition-colors">
                    대기열 제보하기
                </button>
            </div>

            <!-- 출발해요 제보 폼 -->
            <div class="bg-white border border-gray-200 p-5 rounded-2xl shadow-sm">
                <h4 class="font-bold mb-3 flex items-center gap-2">🚌 버스 출발 제보 (출발해요)</h4>
                <label class="block text-sm text-gray-600 mb-3">방금 어떤 버스가 출발했나요?</label>
                
                <div class="grid grid-cols-3 gap-2 mb-5">
                    <!-- 버스 종류 선택 버튼 (라디오 버튼 느낌으로 동작하도록 JS 추가 가능) -->
                    <button class="bus-btn border border-gray-300 py-2 rounded-xl text-sm font-medium focus:bg-blue-600 focus:text-white focus:border-blue-600 transition-colors">작은무당이</button>
                    <button class="bus-btn border border-gray-300 py-2 rounded-xl text-sm font-medium focus:bg-blue-600 focus:text-white focus:border-blue-600 transition-colors">큰무당이</button>
                    <button class="bus-btn border border-gray-300 py-2 rounded-xl text-sm font-medium focus:bg-blue-600 focus:text-white focus:border-blue-600 transition-colors">흰둥이</button>
                </div>
                <button onclick="alert('출발 정보가 브로드캐스트 됩니다! (대기열 감소 계산 로직 실행)')" class="w-full bg-blue-600 text-white py-3 rounded-xl font-bold hover:bg-blue-700 transition-colors shadow-md">
                    버스 출발 제보하기
                </button>
            </div>

        </div>
    </div>

    <script>
        // 대기열 슬라이더 숫자 실시간 업데이트
        const slider = document.getElementById('queue-slider');
        const sliderValueDisplay = document.getElementById('slider-value');
        
        slider.addEventListener('input', function() {
            sliderValueDisplay.innerText = `레벨 ${this.value}`;
        });

        // 정류장 탭 전환 로직
        function switchTab(stationName) {
            const tabBando = document.getElementById('tab-bando');
            const tabAigong = document.getElementById('tab-aigong');
            const currentStation = document.getElementById('current-station');
            const incomingMsg = document.getElementById('incoming-msg');

            currentStation.innerText = stationName;

            if(stationName === '반도체 앞') {
                // UI 스타일 변경
                tabBando.className = "flex-1 py-3 text-center font-bold text-blue-600 border-b-2 border-blue-600 transition-colors";
                tabAigong.className = "flex-1 py-3 text-center text-gray-400 font-medium hover:text-blue-400 transition-colors";
                // 알림 메시지 반전
                incomingMsg.innerText = "AI공학관에서 큰무당이가 출발했어요!";
            } else {
                tabAigong.className = "flex-1 py-3 text-center font-bold text-blue-600 border-b-2 border-blue-600 transition-colors";
                tabBando.className = "flex-1 py-3 text-center text-gray-400 font-medium hover:text-blue-400 transition-colors";
                incomingMsg.innerText = "반도체대학에서 흰둥이가 출발했어요!";
            }
        }
    </script>
</body>
</html>
